<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelia - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-logo-icon">
                <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
                    <circle cx="18" cy="16" r="13" stroke="white" stroke-width="1.6" stroke-opacity="0.5"/>
                    <path d="M18 3C13.03 3 9 7.03 9 12C9 18.75 18 29 18 29C18 29 27 18.75 27 12C27 7.03 22.97 3 18 3Z" fill="white" fill-opacity="0.18" stroke="white" stroke-width="1.5"/>
                    <circle cx="18" cy="12" r="3.2" fill="white"/>
                </svg>
            </div>
            <h1>Bienvenido</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="correo" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="contrasena" required placeholder="••••••••">
                </div>
                <p id="errorMsg" class="error-msg" hidden></p>
                <button type="submit" class="btn btn-primary btn-full">Iniciar sesión</button>
            </form>
            <p class="auth-link">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
