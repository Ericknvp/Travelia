<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelia - Mapa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body, .main { overflow: hidden; }

        #mapaContainer {
            height: calc(100vh - 60px);
            position: relative;
        }
        #mapa {
            height: 100%;
            width: 100%;
            background: var(--bg-deep);
        }

        #mapaFilters {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 5px;
            align-items: center;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 5px 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        .mapa-chip {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            background: none;
            color: var(--text-muted);
            font-family: Inter, sans-serif;
            transition: all 0.18s;
        }
        .mapa-chip:hover { color: var(--text-secondary); background: var(--glass-bg); }
        .mapa-chip.active { color: #fff; }

        #mapaCounter {
            position: absolute;
            bottom: 18px;
            right: 18px;
            z-index: 1000;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 8px 14px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: Inter, sans-serif;
        }

        #mapaLoading {
            position: absolute;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            gap: 14px;
        }
        .loading-spinner {
            width: 38px; height: 38px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .leaflet-popup-content-wrapper {
            background: var(--bg-mid) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--glass-border-strong) !important;
            border-radius: var(--radius-md) !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
            padding: 0 !important;
        }
        .leaflet-popup-content {
            margin: 0 !important;
            padding: 14px 16px !important;
            font-family: Inter, sans-serif !important;
        }
        .leaflet-popup-tip { background: var(--bg-mid) !important; }
        .leaflet-popup-close-button {
            color: var(--text-muted) !important;
            font-size: 20px !important;
            padding: 6px 8px !important;
        }
        .leaflet-control-zoom a {
            background: var(--glass-bg-strong) !important;
            color: var(--text-primary) !important;
            border-color: var(--glass-border) !important;
            backdrop-filter: blur(12px);
        }
        .leaflet-control-zoom a:hover { background: var(--glass-bg) !important; }
        .leaflet-control-attribution {
            background: rgba(0,0,0,0.4) !important;
            color: var(--text-muted) !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: var(--primary-light) !important; }
    </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div id="mapaContainer">

      <div id="mapaLoading">
        <div class="loading-spinner"></div>
      </div>

      <div id="mapa"></div>

      <div id="mapaFilters">
        <button class="mapa-chip active" data-cat="all">Todos</button>
        <button class="mapa-chip" data-cat="tour">Tour</button>
        <button class="mapa-chip" data-cat="hospedaje">Hospedaje</button>
        <button class="mapa-chip" data-cat="restaurante">Restaurante</button>
        <button class="mapa-chip" data-cat="actividad">Actividad</button>
        <button class="mapa-chip" data-cat="sitio">Sitio turístico</button>
      </div>

      <div id="mapaCounter"></div>

    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/mapa.js"></script>
</body>
</html>
